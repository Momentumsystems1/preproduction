<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#020a14" />
    <meta
      name="description"
      content="Momentum Road Command Center - Tactical Mobility Platform"
    />
    <title>MOMENTUM · Road Command Center · Pegasus v3.0</title>

    <!-- Google Fonts for Typography System -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&family=Manrope:wght@400;500;600&family=IBM+Plex+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- MapLibre GL CSS -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@latest/dist/maplibre-gl.css"
    />

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      body {
        font-family: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #0a0a0a;
        color: #ffffff;
      }

      /* Scanline effect */
      .scanline {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 2px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(34, 211, 238, 0.3),
          transparent
        );
        pointer-events: none;
        animation: scanline-move 8s linear infinite;
        z-index: 9999;
      }

      @keyframes scanline-move {
        0% {
          top: 0;
        }
        100% {
          top: 100vh;
        }
      }

      /* Radar sweep animation */
      .radar-sweep {
        position: absolute;
        inset: 0;
        border: 2px solid transparent;
        border-right-color: rgba(34, 211, 238, 0.8);
        border-bottom-color: rgba(34, 211, 238, 0.4);
        animation: radar-spin 3s linear infinite;
      }

      @keyframes radar-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Live dot pulse */
      .live-dot {
        display: inline-block;
        width: 6px;
        height: 6px;
        background: #22d3ee;
        border-radius: 50%;
        animation: pulse-live 2s ease-in-out infinite;
      }

      @keyframes pulse-live {
        0%,
        100% {
          opacity: 1;
          box-shadow: 0 0 0 0 rgba(34, 211, 238, 0.7);
        }
        50% {
          opacity: 0.7;
          box-shadow: 0 0 0 6px rgba(34, 211, 238, 0);
        }
      }

      /* Chevron flicker */
      @keyframes chevron-flicker {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      /* Panel glassmorphism */
      .panel {
        background: rgba(10, 10, 10, 0.75);
        backdrop-filter: blur(12px) saturate(150%);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      .panel-solid {
        background: rgba(2, 10, 20, 0.95);
        backdrop-filter: blur(8px);
        border: 1px solid rgba(34, 211, 238, 0.2);
      }

      /* Brackets decoration */
      .brackets::before {
        content: "[ ";
        color: rgba(34, 211, 238, 0.5);
        margin-right: 4px;
      }

      .brackets::after {
        content: " ]";
        color: rgba(34, 211, 238, 0.5);
        margin-left: 4px;
      }

      /* Animations */
      @keyframes anim-fade-up {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .anim-fade-up {
        animation: anim-fade-up 0.4s ease-out;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div class="scanline"></div>
  </body>
</html>
